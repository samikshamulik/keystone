spring:
  application:
    name: keystone

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/keystone}
    username: ${DATABASE_USERNAME:keystone}
    password: ${DATABASE_PASSWORD:keystone}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-binding-errors: never

keystone:
  jwt:
    secret: ${JWT_SECRET:keystone-default-dev-secret-change-in-production-must-be-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  sla:
    critical-minutes: 240
    high-minutes: 480
    medium-minutes: 1440
    low-minutes: 4320

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

logging:
  level:
    com.meridian.keystone: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
