spring:
  datasource:
    url: jdbc:${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: true

server:
  port: ${PORT:8081}

logging:
  level:
    com.meridian.keystone: INFO
    org.springframework: WARN
