services:
  # ── Spring Boot Backend ────────────────────────────────────────────────────
  - type: web
    name: keystone-api
    runtime: docker
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keystone-dbs
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: keystone-dbs
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: keystone-dbs
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_PORT
        value: 8081
      - key: ALLOWED_ORIGINS
        value: https://keystone-app.vercel.app
      - key: SPRING_PROFILES_ACTIVE
        value: default

databases:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  - name: keystone-dbs
    plan: free
    databaseName: keystone
    user: keystone
